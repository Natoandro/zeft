[project]
name = "zeft"
version = "0.2.4"
description = "Python bindings for the Zeft HTML and XML template engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["hatch_build.py", "native/**", "src/**", "README.md", "pyproject.toml"]
