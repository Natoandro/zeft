name: Python wheels

on:
  pull_request:
  push:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform.name }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            runner: ubuntu-24.04
            zig_target: x86_64-linux-gnu
            wheel_platform: linux
            wheel_arch: x86_64
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            zig_target: aarch64-linux-gnu
            wheel_platform: linux
            wheel_arch: aarch64
          - name: macOS Intel
            runner: macos-15-intel
            zig_target: x86_64-macos
            wheel_platform: macosx
            wheel_arch: x86_64
          - name: macOS Apple Silicon
            runner: macos-15
            zig_target: aarch64-macos
            wheel_platform: macosx
            wheel_arch: arm64
          - name: Windows x86_64
            runner: windows-2025
            zig_target: x86_64-windows-msvc
            wheel_platform: win
            wheel_arch: amd64
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    env:
      ZEFT_ZIG_TARGET: ${{ matrix.platform.zig_target }}
      ZEFT_ZIG_OPTIMIZE: ReleaseSafe
      ZEFT_WHEEL_PLATFORM: ${{ matrix.platform.wheel_platform }}
      ZEFT_WHEEL_ARCH: ${{ matrix.platform.wheel_arch }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Clean build outputs
        shell: bash
        run: |
          rm -rf bindings/python/dist bindings/python/src/zeft/_native* zig-out .zig-cache

      - name: Build wheel
        run: >-
          uv build --no-cache --project bindings/python
          --python ${{ matrix.python-version }} --wheel
          --out-dir bindings/python/dist

      - name: Verify wheel tags
        run: >-
          uv run --no-project
          python bindings/python/scripts/verify_wheel.py

      - name: Install and import wheel
        shell: bash
        run: |
          wheel=$(find bindings/python/dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          uv run --no-project --with "$wheel" python \
            bindings/python/scripts/smoke_test.py ok

      - uses: actions/upload-artifact@v4
        with:
          name: zeft-wheel-${{ matrix.platform.zig_target }}-py${{ matrix.python-version }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  source-distribution:
    name: Source distribution / CPython 3.13 / Linux x86_64
    runs-on: ubuntu-24.04
    env:
      ZEFT_ZIG_OPTIMIZE: ReleaseSafe
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build clean source distribution
        shell: bash
        run: |
          rm -rf bindings/python/dist bindings/python/src/zeft/_native* zig-out .zig-cache
          uv build --no-cache --project bindings/python --sdist \
            --out-dir bindings/python/dist

      - name: Install source distribution and render
        shell: bash
        run: |
          sdist=$(find bindings/python/dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$sdist"
          uv run --no-project --with "$sdist" python \
            bindings/python/scripts/smoke_test.py sdist

      - uses: actions/upload-artifact@v4
        with:
          name: zeft-source-distribution
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error
