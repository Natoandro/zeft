[project]
name = "zeft-dev-tools"
version = "0.2.0"
description = "Development tools for the Zeft repository"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bump-version = "scripts.bump_version:main"
check-zig-line-length = "scripts.check_zig_line_length:main"
tag-release = "scripts.tag_release:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.hatch.build.targets.sdist]
include = ["scripts/**", "pyproject.toml"]

[tool.uv.workspace]
members = ["bindings/python"]
